# Reverse proxy — Journal de bord Logitrak (journal.logitrak.ch)
# À copier dans /etc/nginx/sites-available/journal.logitrak.ch
# puis : sudo ln -s /etc/nginx/sites-available/journal.logitrak.ch /etc/nginx/sites-enabled/
# HTTPS : sudo certbot --nginx -d journal.logitrak.ch (ajoute le bloc SSL + redirection)
#
# Ce fichier ne touche à AUCUNE autre application du VPS.

map $http_upgrade $journal_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name journal.logitrak.ch;

    client_max_body_size 25m;

    # Autorise l'affichage en iframe dans Navixy / Logitrak uniquement
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.logitrak.fr https://logitrak.fr https://*.logitrak.ch https://logitrak.ch https://*.navixy.com https://*.navixy.io;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/journal.logitrak.ch.access.log;
    error_log  /var/log/nginx/journal.logitrak.ch.error.log;

    # API backend (inclut le WebSocket /api/livre/realtime)
    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $journal_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Frontend React (fichiers statiques servis par le conteneur journal_frontend)
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
