server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # App shell : toujours revalidé -> un nouveau déploiement est pris en compte
    # immédiatement (les assets hashés /static/ restent en cache long/immutable).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
