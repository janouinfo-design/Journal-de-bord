<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=390, initial-scale=1"/><title>Profil — Light</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
--primary:#2563eb;--primarySoft:#eff4ff;--success:#16a34a;--danger:#dc2626;--dangerSoft:#fef2f2;
--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10)}
*{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--text)}
.phone{width:390px;min-height:844px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:26px;font-weight:800;margin:8px 0 14px;letter-spacing:-.3px}
.hero{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--primarySoft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.hero .nm{font-size:18px;font-weight:800}
.hero .em{color:var(--muted);font-size:13px;margin-top:2px}
.badge{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--primarySoft);color:var(--primary)}
.section{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:20px 2px 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.item .ic{width:26px;text-align:center;font-size:17px}
.item .lb{flex:1;font-size:15px;font-weight:600}
.item .vv{color:var(--muted);font-size:14px}
.chev{color:var(--muted);font-size:20px}
.logout{margin-top:20px;width:100%;border:1px solid var(--danger);background:var(--dangerSoft);color:var(--danger);border-radius:12px;padding:13px;font-size:15px;font-weight:800}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:390px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 12px}
.tab{font-size:11px;color:var(--muted);text-align:center}.tab .ic{font-size:18px;display:block}.tab.active{color:var(--primary)}
</style></head><body><div class="phone">
<h1>Profil</h1>
<div class="hero"><div class="avatar">OD</div><div><div class="nm">Orhan Demir</div><div class="em">orhan@logitrak.ch</div><span class="badge">Chauffeur</span></div></div>

<div class="section">Compte</div>
<div class="card">
  <div class="item"><span class="ic">🚚</span><span class="lb">Véhicule actuel</span><span class="vv">GE 123456</span><span class="chev">›</span></div>
  <div class="item"><span class="ic">🔒</span><span class="lb">Mot de passe</span><span class="chev">›</span></div>
  <div class="item"><span class="ic">🔔</span><span class="lb">Notifications</span><span class="vv">Activées</span><span class="chev">›</span></div>
</div>

<div class="section">Application</div>
<div class="card">
  <div class="item"><span class="ic">⚙️</span><span class="lb">Réglages</span><span class="chev">›</span></div>
  <div class="item"><span class="ic">ℹ️</span><span class="lb">Version</span><span class="vv">2.3.0</span></div>
</div>

<button class="logout">Se déconnecter</button>
</div>
<div class="tabbar"><div class="tab"><span class="ic">🚚</span>Conduite</div><div class="tab"><span class="ic">🗺️</span>Trajets</div><div class="tab"><span class="ic">📄</span>Documents</div><div class="tab"><span class="ic">🔧</span>Inspection</div><div class="tab active"><span class="ic">👤</span>Profil</div></div>
</body></html>
